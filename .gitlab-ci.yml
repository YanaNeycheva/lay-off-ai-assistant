# CI: run the stdlib unittest suite (benefits calculator + static invariants).
# Stdlib only — no pip install, no pytest.

test:
  image: python:3.12
  script:
    - python -m unittest discover -s tests -v
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
